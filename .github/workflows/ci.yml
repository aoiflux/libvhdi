# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The governing constraint of this library, enforced rather than merely
  # documented: the core module must never acquire a dependency. Consumers who
  # want only VHD/VHDX parsing must be able to take libvhdi without absorbing
  # anything else into their module graph.
  #
  # This job is deliberately tiny and gates the rest: if the core stops being
  # zero-dependency, nothing else about the build matters.
  # ---------------------------------------------------------------------------
  guard:
    name: Zero-dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: The core declares no dependencies
        run: |
          set -euo pipefail

          requires=$(go mod edit -json | jq -r '.Require // [] | length')
          if [ "${requires}" -ne 0 ]; then
            echo "::error::The core module has acquired ${requires} dependency/dependencies."
            echo "Filesystem-aware and table-aware code belongs in a satellite module."
            go mod edit -json | jq '.Require'
            exit 1
          fi

          if [ -f go.sum ]; then
            echo "::error::go.sum exists, so the core module has a dependency graph."
            cat go.sum
            exit 1
          fi

          modules=$(go list -m all)
          if [ "$(echo "${modules}" | wc -l)" -ne 1 ]; then
            echo "::error::go list -m all reports more than one module:"
            echo "${modules}"
            exit 1
          fi

          echo "No requirements, no go.sum, one module in the graph."

      - name: Nothing outside the standard library is reachable
        run: |
          set -euo pipefail
          deps=$(go list -deps ./...)

          # A package is external when the FIRST element of its import path
          # contains a dot, which is how the Go toolchain itself tells a domain
          # from a standard library path. Testing the whole path is wrong:
          # crypto/internal/entropy/v1.0.0 is standard library and has a dot.
          external=$(echo "${deps}" \
            | grep -v '^github.com/aoiflux/libvhdi\(/\|$\)' \
            | awk -F/ '$1 ~ /\./' || true)
          if [ -n "${external}" ]; then
            echo "::error::Non-standard-library packages reachable from the core module:"
            echo "${external}"
            exit 1
          fi

          # libvhdi/change shares the libvhdi/ prefix, so the check above passes
          # it by name. It is a separate module carrying six filesystem
          # libraries, and the whole point of the split is that the core never
          # reaches it: vhdimap is the contract, and it points one way only.
          leak=$(echo "${deps}" | grep '^github.com/aoiflux/libvhdi/change' || true)
          if [ -n "${leak}" ]; then
            echo "::error::The core module imports the change module:"
            echo "${leak}"
            echo "The core declares the vhdimap contract; it must never depend on an implementation of it."
            exit 1
          fi

          echo "Standard library only, and the change module is out of reach."

  build:
    name: Build, vet and format
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./...

      # gofmt walks the directory tree and ignores module boundaries, so this
      # one invocation covers the satellite modules too. They do not repeat it.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "${unformatted}"
            gofmt -d .
            exit 1
          fi

      # Two example binaries were committed once, and because `go build`
      # rewrites them, every build then reported a dirty tree. .gitignore stops
      # that recurring; this stops it recurring silently.
      - name: No compiled output is committed
        run: |
          set -euo pipefail
          binaries=$(git ls-files | grep -Ei '[.](exe|dll|so|dylib|test|out)$' || true)
          if [ -n "${binaries}" ]; then
            echo "::error::Compiled output is tracked in git:"
            echo "${binaries}"
            exit 1
          fi

          # A catch-all for the extensionless case: `go build` inside an example
          # directory writes a binary named after that directory. The whole
          # repository is about 1 MB and its largest file is around 30 KB, so
          # anything past 256 KB is not source.
          oversized=$(git ls-files -z | xargs -0 -r du -b 2>/dev/null \
            | awk '$1 > 262144 { print $1 " bytes  " $2 }' || true)
          if [ -n "${oversized}" ]; then
            echo "::error::Tracked files larger than 256 KB, which is probably build output:"
            echo "${oversized}"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # The parser decodes Windows path separators in VHD parent locators
          # and resolves parents against the host filesystem, so the matrix
          # earns its place. Race behaviour does not vary by OS, so the race
          # detector runs once rather than three times.
          - os: ubuntu-latest
            race: true
          - os: windows-latest
            race: false
          - os: macos-latest
            race: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This also replays the checked-in fuzz corpus, which is the regression
      # guard that matters. Exploring for new inputs is a nightly workflow.
      - run: go test ./...

      # The library hands the same *VirtualDisk to concurrent readers, so the
      # race detector is part of the contract, not an optional extra.
      - name: Test with the race detector
        if: matrix.race
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Satellite modules. They are separate modules precisely so their dependencies
  # stay out of the core, which also means `go build ./...` at the repository
  # root does not cover them and nothing else would notice them breaking.
  #
  # One job rather than a matrix: three checkouts and three toolchain installs
  # to compile two small example programs is more ceremony than the work
  # deserves. gofmt is not repeated here; the build job already covers it.
  # ---------------------------------------------------------------------------
  satellites:
    name: Satellite modules
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet each module
        run: |
          set -euo pipefail
          for module in change examples/offsets examples/changes; do
            echo "::group::${module}"
            (cd "${module}" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done

      # Only change has tests; the examples are compile-checked above.
      - name: Test the change module
        working-directory: change
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
