# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, on one platform, with the checks ordered cheapest-first.
#
# A matrix over three operating systems was dropped deliberately. The only
# OS-dependent code in the library is path normalisation, which case-folds on
# Windows alone (chainKey in reader/open.go, normalizePath in
# reader/checkpoint.go) — so Linux and macOS execute identical code and the
# macOS runner duplicated the Linux one exactly. Windows is covered
# continuously by development, which happens there.
#
# Scheduled fuzzing was also dropped. The checked-in corpus under testdata/fuzz
# is replayed by plain `go test`, so every push still re-runs every input that
# has ever been interesting, which is the regression guard. Open-ended
# exploration produced one failure in six nights and it was a false alarm: the
# fuzzing coordinator's own -fuzztime deadline surfacing as "context deadline
# exceeded" in a target that takes no context at all. Run it by hand when
# touching a parser:
#
#   go test ./reader/ -run '^$' -fuzz FuzzOpen -fuzztime 5m
jobs:
  ci:
    name: Guard, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The core module has no go.sum by design, so the default **/go.sum
          # lookup logged a cache warning on every run. change/go.sum is the
          # only dependency file in the repository.
          cache-dependency-path: change/go.sum

      # -----------------------------------------------------------------------
      # The governing constraint of this library, enforced rather than merely
      # documented: the core module must never acquire a dependency. Consumers
      # who want only VHD/VHDX parsing must be able to take libvhdi without
      # absorbing anything else into their module graph.
      #
      # First, because if this fails nothing else about the build matters.
      # -----------------------------------------------------------------------
      - name: Zero-dependency guard
        run: |
          set -euo pipefail

          requires=$(go mod edit -json | jq -r '.Require // [] | length')
          if [ "${requires}" -ne 0 ]; then
            echo "::error::The core module has acquired ${requires} dependency/dependencies."
            echo "Filesystem-aware and table-aware code belongs in a satellite module."
            go mod edit -json | jq '.Require'
            exit 1
          fi

          if [ -f go.sum ]; then
            echo "::error::go.sum exists, so the core module has a dependency graph."
            cat go.sum
            exit 1
          fi

          modules=$(go list -m all)
          if [ "$(echo "${modules}" | wc -l)" -ne 1 ]; then
            echo "::error::go list -m all reports more than one module:"
            echo "${modules}"
            exit 1
          fi

          deps=$(go list -deps ./...)

          # A package is external when the FIRST element of its import path
          # contains a dot, which is how the Go toolchain itself tells a domain
          # from a standard library path. Testing the whole path is wrong:
          # crypto/internal/entropy/v1.0.0 is standard library and has a dot.
          external=$(echo "${deps}" \
            | grep -v '^github.com/aoiflux/libvhdi\(/\|$\)' \
            | awk -F/ '$1 ~ /\./' || true)
          if [ -n "${external}" ]; then
            echo "::error::Non-standard-library packages reachable from the core module:"
            echo "${external}"
            exit 1
          fi

          # libvhdi/change shares the libvhdi/ prefix, so the check above passes
          # it by name. It is a separate module carrying six filesystem
          # libraries, and the whole point of the split is that the core never
          # reaches it: vhdimap is the contract, and it points one way only.
          leak=$(echo "${deps}" | grep '^github.com/aoiflux/libvhdi/change' || true)
          if [ -n "${leak}" ]; then
            echo "::error::The core module imports the change module:"
            echo "${leak}"
            echo "The core declares the vhdimap contract; it must never depend on an implementation of it."
            exit 1
          fi

          echo "No requirements, no go.sum, one module, standard library only."

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      # gofmt walks the directory tree and ignores module boundaries, so this
      # one invocation covers the satellite modules too.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "${unformatted}"
            gofmt -d .
            exit 1
          fi

      # Two example binaries were committed once, and because `go build`
      # rewrites them, every build then reported a dirty tree.
      - name: No compiled output is committed
        run: |
          set -euo pipefail
          binaries=$(git ls-files | grep -Ei '[.](exe|dll|so|dylib|test|out)$' || true)
          if [ -n "${binaries}" ]; then
            echo "::error::Compiled output is tracked in git:"
            echo "${binaries}"
            exit 1
          fi

          # A catch-all for the extensionless case: `go build` inside an example
          # directory writes a binary named after that directory. The whole
          # repository is about 1 MB and its largest file is around 30 KB, so
          # anything past 256 KB is not source.
          oversized=$(git ls-files -z | xargs -0 -r du -b 2>/dev/null \
            | awk '$1 > 262144 { print $1 " bytes  " $2 }' || true)
          if [ -n "${oversized}" ]; then
            echo "::error::Tracked files larger than 256 KB, which is probably build output:"
            echo "${oversized}"
            exit 1
          fi

      # This also replays the checked-in fuzz corpus.
      - name: Test
        run: go test ./...

      # The library hands the same *VirtualDisk to concurrent readers, so the
      # race detector is part of the contract, not an optional extra. It runs
      # after the plain suite so a failure here means a race rather than a bug.
      - name: Test with the race detector
        run: go test -race ./...

      # Satellite modules have their own go.mod precisely so their dependencies
      # stay out of the core, which also means `go build ./...` at the root does
      # not cover them and nothing else would notice them breaking. gofmt is not
      # repeated; the invocation above already covered them.
      - name: Satellite modules
        run: |
          set -euo pipefail
          for module in change examples/offsets examples/changes; do
            echo "::group::${module}"
            (cd "${module}" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done
          # Only change has tests; the examples are compile-checked above.
          cd change
          go test ./...
          go test -race ./...
